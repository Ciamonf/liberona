<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Ti ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9ecf,#ffc8dd,#d8b4fe);
overflow:hidden;
}

.contenedor{
text-align:center;
}

h1{
font-size:45px;
color:white;
margin-bottom:15px;
}

p{
color:white;
font-size:18px;
margin-bottom:40px;
}

.botones{
display:flex;
justify-content:center;
gap:25px;
}

button{
border:none;
padding:15px 45px;
font-size:22px;
border-radius:50px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

#yes{
background:#22c55e;
color:white;
}

#no{
background:#ef4444;
color:white;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>💖 ¿Tú me amas? 💖</h1>

<p>Responde con sinceridad ❤️</p>

<div class="botones">
<button id="yes">YES</button>
<button id="no">NO</button>
</div>

</div>

</body>
</html>
