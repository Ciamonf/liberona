<script>
let intentos = 0;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const mensaje = document.getElementById("mensaje");

const frases = [
"Como que no!!? 😶",
"...",
"Creo que te equivocaste 💜🫰",
"..."
];

let subida = 0;

// Empieza al lado de YES
no.style.position = "relative";

no.onclick = function(){

intentos++;

if(intentos <= 4){
mensaje.innerHTML = frases[intentos-1];
}

yes.style.transform = "scale(" + (1 + intentos*0.15) + ")";

subida += 50;

no.style.transform =
"translateY(-" + subida + "px) scale(" + (1 - intentos*0.1) + ")";

if(intentos >= 5){
no.style.opacity = "0";

setTimeout(()=>{
no.style.display = "none";
mensaje.innerHTML = "🫂💗 Elegí YES 🫂💗";
yes.style.transform = "scale(1.6)";
},500);
}

};

yes.onclick = function(){

mensaje.innerHTML = "🎁 Cargando los regalos... ❤️";

};
</script>
