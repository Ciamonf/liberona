<script>
let intentos = 0;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const mensaje = document.getElementById("mensaje");

const frases = [
  "¿Segura? 🥺",
  "Creo que te equivocaste 💜",
  "Piénsalo otra vez ",
  "No acepto esa respuesta 😤",
  "Ya no tienes opción xd😆"
];

no.onclick = function () {
  intentos++;

  if (intentos <= 5) {
    mensaje.innerHTML = frases[intentos - 1];
  }

  yes.style.transform = "scale(" + (1 + intentos * 0.2) + ")";

  no.style.position = "fixed";
  no.style.left = (Math.random() * 80) + "%";
  no.style.top = (Math.random() * 80) + "%";

  if (intentos >= 5) {
    no.style.display = "none";
    mensaje.innerHTML = "❤️ Solo queda una respuesta ❤️";
  }
};

yes.onclick = function () {
  mensaje.innerHTML = "🎁 ¡Comienzan los regalos! ❤️";
};
</script>
