<script>

let intentos = 0;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const mensaje = document.getElementById("mensaje");

const frases = [
"Como que no!!? 😶",
"...",
"Creo que te equivocaste 💜🫰",
"..."
];

no.onclick = function(){

    intentos++;

    if(intentos <= 4){
        mensaje.innerHTML = frases[intentos-1];
    }

    // YES crece
    yes.style.transform = "scale(" + (1 + intentos * 0.15) + ")";

    // NO solo se hace más chico
    no.style.transform = "scale(" + (1 - intentos * 0.15) + ")";

    if(intentos >= 5){
        no.style.display = "none";
        mensaje.innerHTML = "🫂💗 Nel, toma, elegí YES 🫂💗";
        yes.style.transform = "scale(1.6)";
    }

};

yes.onclick = function(){

    mensaje.innerHTML = "🎁 Cargando los regalos... ❤️";

    // Aquí después pondremos la pantalla de los regalos.

};

</script>
