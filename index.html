<script>
let intentos = 0;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const mensaje = document.getElementById("mensaje");

const frases = [
  "Como que no!!? 😶",
  "...",
  "Creo que te equivocaste 💜🫰",
  "..."
];

// NO empieza al lado de YES
no.style.position = "relative";
no.style.display = "inline-block";
no.style.marginLeft = "10px";

no.onclick = function () {

  intentos++;

  if (intentos <= 4) {
    mensaje.innerHTML = frases[intentos - 1];
  }

  // YES crece
  yes.style.transform = "scale(" + (1 + intentos * 0.12) + ")";

  // NO se hace un poquito más chico
  no.style.transform = "scale(" + (1 - intentos * 0.08) + ")";

  // Se mueve entre lugares fijos
  if (intentos == 1) {
    no.style.position = "fixed";
    no.style.left = "78%";
    no.style.top = "25%";
  }

  if (intentos == 2) {
    no.style.left = "18%";
    no.style.top = "72%";
  }

  if (intentos == 3) {
    no.style.left = "82%";
    no.style.top = "72%";
  }

  if (intentos == 4) {
    no.style.left = "18%";
    no.style.top = "25%";
  }

  if (intentos >= 5) {
    no.style.display = "none";
    mensaje.innerHTML = "🫂💗 Elegí YES 🫂💗";
    yes.style.transform = "scale(1.6)";
  }

};

yes.onclick = function () {

  mensaje.innerHTML = "🎁 Cargando los regalos... ❤️";

  // Después pondremos aquí la pantalla de los regalos.

};
</script>
